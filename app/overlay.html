<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HeadsUp</title>
<style>
  :root {
    --accent: #2EC4B6;
    --accent-deep: #23A99D;
    --accent-ink: #062b27; /* text on the accent: white would fail contrast */
    --cream: #f4efe8;
    --ink: rgba(255, 255, 255, 0.92);
    --ink-2: rgba(255, 255, 255, 0.62);
    --glass: rgba(26, 26, 28, 0.94);
    --glass-border: rgba(255, 255, 255, 0.14);
    --green: #3fb46b;
    --red: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: transparent; overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; pointer-events: none;
  }

  /* ------------------------------------------------------------ banner */
  #stack {
    position: absolute; top: 14px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .banner {
    position: relative;
    width: min(440px, 92vw);
    display: grid; grid-template-columns: 40px 1fr auto; column-gap: 12px; align-items: start;
    padding: 12px 14px 13px 12px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(40,40,44,0.96), var(--glass));
    border: 1px solid var(--glass-border);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 18px 50px rgba(0,0,0,0.55),
      0 4px 14px rgba(0,0,0,0.35);
    color: var(--ink);
    transform: translateY(-140px) scale(0.96);
    opacity: 0;
    overflow: hidden;
    animation: slide-in 620ms cubic-bezier(0.18, 1.25, 0.32, 1) forwards;
  }
  .banner.leaving { animation: slide-out 380ms cubic-bezier(0.5, 0, 0.75, 0) forwards; }
  @keyframes slide-in { to { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes slide-out {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to   { transform: translateY(-120px) scale(0.96); opacity: 0; }
  }
  .app-icon {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(180deg, #34D3C0, #14968C);
    display: grid; place-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35), 0 0 0 0.5px rgba(255,255,255,0.18) inset;
  }
  /* The mark is drawn in the app icon's own frame, so it fills the tile the same way. */
  .app-icon svg { width: 40px; height: 40px; }
  /* An amber dot would vanish on the amber permission tile. */
  .banner.permission .app-icon .mk-dot { fill: #fff; }
  .texts { min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 1px; }
  .title { font-weight: 650; font-size: 15px; letter-spacing: -0.01em; line-height: 18px; }
  .subtitle { font-size: 13.5px; color: var(--ink); opacity: 0.9; line-height: 17px; }
  .body {
    font-size: 13.5px; color: var(--ink-2); line-height: 17px; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .time { font-size: 12.5px; color: var(--ink-2); padding-top: 2px; white-space: nowrap; }
  .banner.permission .app-icon { background: linear-gradient(160deg, #ffd27a, #f0a93b 55%, #d98b1c); }
  .banner.info .app-icon { background: linear-gradient(160deg, #8bb7ff, #5a8def 55%, #3f6fd0); }
  .banner.question .app-icon { background: linear-gradient(160deg, #c9a2ff, #9b6cf0 55%, #7a4fd1); }
  .banner.question .body, .banner.permission .body { -webkit-line-clamp: 3; color: var(--ink); }
  .banner.permission .body { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }

  /* ------------------------------------------------------- interactive */
  .banner.interactive {
    pointer-events: auto; cursor: default;
    width: min(480px, 92vw);
    padding: 14px 16px 16px 14px;
    border-radius: 24px;
  }
  .banner.interactive .texts { gap: 3px; }
  /* The whole question stays readable: it scrolls instead of being clamped. */
  .banner.interactive .body {
    font-size: 15px; line-height: 20px; color: var(--ink); font-weight: 500;
    margin-top: 4px; display: block; -webkit-line-clamp: none; white-space: pre-line; max-height: 120px; overflow-y: auto;
  }
  .banner.interactive .body, .cmd, .list { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent; }
  /* Cards with buttons beyond the newest few wait, counted in the "+N" pill. */
  .banner.queued { display: none; }
  .more {
    padding: 4px 12px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-border);
    color: var(--ink-2); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  /* Until the pointer moves over a card that has just appeared or moved, clicks are ignored. */
  .actions, .list { transition: opacity 150ms; }
  .banner.arming .actions, .banner.arming .list { opacity: 0.55; }
  .qhead { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-top: 6px; }
  .panel { grid-column: 1 / -1; margin-top: 12px; }
  .list {
    display: flex; flex-direction: column;
    background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px; overflow-x: hidden; overflow-y: auto; max-height: 300px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 11px 14px; cursor: pointer;
    border-top: 1px solid rgba(255,255,255,0.07);
    transition: background 120ms;
  }
  .row:first-child { border-top: 0; }
  .row:hover { background: rgba(255,255,255,0.10); }
  .row:active { background: rgba(46,196,182,0.28); }
  .row .lbl { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 18px; }
  .row .desc { font-size: 12.5px; color: var(--ink-2); line-height: 16px; margin-top: 2px; }
  .row .chev { color: var(--ink-2); font-size: 15px; opacity: 0.55; flex: none; }
  .row.sel { background: rgba(46,196,182,0.20); }
  .row.sel .chev { color: var(--accent); opacity: 1; }
  .cmd {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; line-height: 18px;
    color: var(--cream); background: rgba(0,0,0,0.38); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all;
    /* The full text the host sends (line breaks kept) scrolls; nothing is clipped silently. */
    max-height: 216px; overflow: auto;
    direction: ltr; unicode-bidi: isolate;
  }
  /* Cut markers and made-visible hidden characters must stand out from the command. */
  .cmd .mark { color: #ffd27a; background: rgba(240,169,59,0.18); border-radius: 4px; }
  .row.other .lbl { color: var(--ink-2); font-weight: 500; }
  .free { display: flex; gap: 8px; margin-top: 10px; }
  .free input {
    flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink);
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px;
    padding: 0 12px; height: 42px; outline: none;
  }
  .free input:focus { border-color: rgba(46,196,182,0.8); box-shadow: 0 0 0 3px rgba(46,196,182,0.2); }
  .free .btn { width: 110px; flex: none; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .actions.single { grid-template-columns: 1fr; }
  .btn {
    appearance: none; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08);
    color: var(--ink); font: inherit; font-size: 14px; font-weight: 650; height: 42px; border-radius: 13px;
    cursor: pointer; transition: background 120ms, transform 120ms, border-color 120ms;
  }
  .btn:hover { background: rgba(255,255,255,0.14); }
  .btn:active { transform: scale(0.985); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn.primary:hover { background: var(--accent-deep); }
  .btn.danger:hover { background: rgba(229,72,77,0.22); border-color: rgba(229,72,77,0.6); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; min-height: 16px; font-size: 11.5px; color: var(--ink-2); }
  .foot .hint { font-weight: 600; }
  .foot .count { font-variant-numeric: tabular-nums; opacity: 0.8; }
  .progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--accent); opacity: 0.7; transform-origin: left; }
  .banner.answered .panel:not(.foot), .banner.answered .progress, .banner.expired .panel:not(.foot), .banner.expired .progress { display: none; }
  .banner.answered .foot .hint { color: var(--green); }
  .banner.answered .foot .count, .banner.expired .foot .count { display: none; }

  /* -------------------------------------------------------------- logo */
  #logo-slot {
    position: absolute; top: 18px; right: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .logo-card {
    position: relative;
    width: 150px; height: 150px;
    display: grid; place-items: center;
    opacity: 0;
    transform: scale(0.2) rotate(-120deg);
    animation: logo-in 900ms cubic-bezier(0.17, 1.35, 0.35, 1) forwards;
  }
  .logo-card.leaving { animation: logo-out 500ms cubic-bezier(0.5, 0, 0.75, 0) forwards; }
  @keyframes logo-in { to { opacity: 1; transform: scale(1) rotate(0deg); } }
  @keyframes logo-out {
    from { opacity: 1; transform: scale(1) rotate(0deg); }
    to   { opacity: 0; transform: scale(0.6) rotate(40deg); }
  }
  .glow {
    position: absolute; inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(46,196,182,0.55) 0%, rgba(46,196,182,0.18) 40%, rgba(46,196,182,0) 70%);
    animation: glow-pulse 1.8s ease-in-out infinite;
    filter: blur(2px);
  }
  @keyframes glow-pulse {
    0%, 100% { transform: scale(0.9); opacity: 0.7; }
    50%      { transform: scale(1.15); opacity: 1; }
  }
  .ring {
    position: absolute; inset: 12px; border-radius: 50%;
    border: 2px solid rgba(244,239,232,0.0);
    animation: ring-burst 1.6s ease-out infinite;
  }
  .ring.r2 { animation-delay: 0.55s; }
  .ring.r3 { animation-delay: 1.1s; }
  @keyframes ring-burst {
    0%   { transform: scale(0.55); border-color: rgba(244,239,232,0.55); }
    100% { transform: scale(1.35); border-color: rgba(244,239,232,0); }
  }
  .logo-svg {
    width: 118px; height: 118px; position: relative;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
  }
  /* The chevrons rise in a loop, the lower one a beat later; the dot pulses. */
  .logo-svg .mk-up, .logo-svg .mk-low { animation: rise 1.5s ease-in-out infinite; }
  .logo-svg .mk-low { animation-delay: 0.16s; }
  @keyframes rise {
    0%, 100% { transform: translateY(0); }
    45%, 55% { transform: translateY(-7px); }
  }
  .logo-svg .mk-dot {
    transform-box: fill-box; transform-origin: center;
    animation: dot-pulse 1.5s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }
  .caption {
    padding: 7px 14px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-border);
    color: var(--cream); font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(-8px);
    animation: caption-in 500ms 350ms cubic-bezier(0.2, 1, 0.3, 1) forwards;
    white-space: nowrap;
  }
  .caption.leaving { animation: caption-out 300ms ease-in forwards; }
  @keyframes caption-in { to { opacity: 1; transform: translateY(0); } }
  @keyframes caption-out { to { opacity: 0; transform: translateY(-8px); } }
  .caption b { color: var(--accent); }
</style>
</head>
<body>
  <div id="stack"></div>
  <div id="logo-slot"></div>
  <canvas id="icon-canvas" width="32" height="32" hidden></canvas>

<script>
  // Bridge to the host. Electron provides window.overlay through its preload script;
  // the Tauri build exposes window.__TAURI__ (invoke + events) and gets the same API here.
  if (!window.overlay && window.__TAURI__) {
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    window.overlay = {
      on(channel, handler) { return listen(channel, (e) => handler(e.payload)); },
      ready() { invoke('ready'); },
      itemDone() { invoke('item_done'); },
      log(message) { invoke('rlog', { message: String(message) }); },
      sendTrayIcon() {},
      hotRects(rects) { invoke('hot_rects', { rects }); },
      answer(id, data) { invoke('answer', { id: String(id), data }); },
      extendWait(id, ms) { invoke('extend_wait', { id: String(id), ms }); },
      focusInput(active) { invoke('focus_input', { active: !!active }); },
    };
  }

  // HeadsUp mark: two rising chevrons and an amber dot, in the app icon's 100x100 frame (its
  // rounded square spans 4..96). Colours are attributes, not inline styles (CSP).
  function markShapes(color, dot) {
    const line = `fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round"`;
    return `<polyline class="mk-up" points="23,57 46,35 69,57" ${line} stroke-width="11.7"/>`
      + `<polyline class="mk-low" points="29,77.5 46,62.5 63,77.5" ${line} stroke-width="9.4" opacity=".6"/>`
      + `<circle class="mk-dot" cx="75" cy="26" r="10" fill="${dot}"/>`;
  }

  function markSvg({ size = 100, color = '#fff', dot = '#FFC457' } = {}) {
    return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">${markShapes(color, dot)}</svg>`;
  }

  // The whole app icon: teal rounded square with a gap around the dot, white chevrons, amber
  // dot. Ids are unique per copy, since several can be in the page at once.
  let badgeSeq = 0;
  function badgeSvg({ size = 100 } = {}) {
    const id = `hu-badge-${++badgeSeq}`;
    return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">`
      + `<defs><linearGradient id="${id}-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D3C0"/><stop offset="1" stop-color="#14968C"/></linearGradient>`
      + `<mask id="${id}-m"><rect width="100" height="100" fill="#fff"/><circle cx="75" cy="26" r="14" fill="#000"/></mask></defs>`
      + `<rect x="4" y="4" width="92" height="92" rx="22" fill="url(#${id}-g)" mask="url(#${id}-m)"/>`
      + `${markShapes('#fff', '#FFC457')}</svg>`;
  }

  // ------------------------------------------------------------ audio
  let audioCtx = null;
  function ctx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, gain = 0.18, type = 'sine') {
    const ac = ctx();
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime + start);
    g.gain.setValueAtTime(0.0001, ac.currentTime + start);
    g.gain.exponentialRampToValueAtTime(gain, ac.currentTime + start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + dur);
    osc.connect(g).connect(ac.destination);
    osc.start(ac.currentTime + start);
    osc.stop(ac.currentTime + start + dur + 0.05);
  }
  function chimeNotify() {
    tone(1046.5, 0.00, 0.22, 0.16);
    tone(1318.5, 0.11, 0.26, 0.14);
    tone(1568.0, 0.22, 0.45, 0.12);
  }
  function chimeAsk() {
    tone(880.0, 0.00, 0.25, 0.14);
    tone(1174.7, 0.14, 0.40, 0.14);
  }
  function chimeLogo() {
    tone(523.25, 0.00, 0.30, 0.12, 'triangle');
    tone(659.25, 0.12, 0.30, 0.12, 'triangle');
    tone(783.99, 0.24, 0.30, 0.12, 'triangle');
    tone(1046.5, 0.36, 0.70, 0.14, 'triangle');
    tone(2093.0, 0.42, 0.60, 0.05, 'sine');
  }

  // ------------------------------------------------------------ banner
  const stack = document.getElementById('stack');
  const MAX_BANNERS = 3;      // plain banners on screen at once
  const MAX_INTERACTIVE = 3;  // cards with buttons on screen at once; the rest wait behind "+N"
  const ARM_MS = 700;         // a new card ignores clicks this long, and until the pointer moves over it
  const REARM_MS = 350;       // the same after a card moved or changed under the pointer

  function bannerShell(p, extraClass) {
    const el = document.createElement('div');
    el.className = `banner ${p.kind || 'done'} ${extraClass || ''}`;
    el.innerHTML = `
      <div class="app-icon">${markSvg({ size: 40 })}</div>
      <div class="texts">
        <div class="title">${escapeHtml(p.title || 'Claude')}</div>
        ${p.subtitle ? `<div class="subtitle">${escapeHtml(p.subtitle)}</div>` : ''}
        <div class="content"></div>
      </div>
      <div class="time">${escapeHtml(p.nowLabel || 'now')}</div>`;
    if (extraClass === 'interactive') {
      // Newest card on top, so it is always on screen; older ones move down or wait.
      stack.prepend(el);
      return el;
    }
    stack.appendChild(el);
    const plain = [...stack.children].filter((b) =>
      b.classList.contains('banner') && !b.classList.contains('interactive') && !b.classList.contains('leaving'));
    while (plain.length > MAX_BANNERS) dismiss(plain.shift());
    return el;
  }

  function showBanner(p) {
    const el = bannerShell(p);
    const c = el.querySelector('.content');
    if (p.body) c.innerHTML = `<div class="body">${escapeHtml(p.body)}</div>`;
    else c.remove();
    if (p.sound) { try { chimeNotify(); } catch {} }
    el._timer = setTimeout(() => dismiss(el), p.durationMs || 6000);
  }

  function dismiss(el) {
    if (!el || el.classList.contains('leaving')) return;
    const inter = el.classList.contains('interactive');
    if (inter) window.overlay.log(`dismiss ${el.dataset.id}`);
    clearTimeout(el._timer);
    el.classList.add('leaving');
    const gone = () => {
      el.remove();
      if (inter) layoutStack();
      window.overlay.itemDone();
    };
    // A waiting card is not rendered: there is no slide-out to wait for.
    if (el.classList.contains('queued')) { gone(); return; }
    if (inter) reportHotRects();
    el.addEventListener('animationend', gone, { once: true });
  }

  // ------------------------------------------------------- interactive
  const interactive = new Map(); // id -> element

  // Keep the main process informed about where the clickable banners are.
  let rectTimer = null;
  function reportHotRects() {
    const rects = [];
    for (const el of stack.querySelectorAll('.banner.interactive')) {
      if (el.classList.contains('leaving') || el.classList.contains('queued')) { delete el._top; continue; }
      // A card that moved (one above it came, went or changed size) must not take a click
      // aimed at what was there before.
      const top = el.offsetTop;
      if (el._top !== undefined && Math.abs(top - el._top) > 8) disarm(el, REARM_MS);
      el._top = top;
      // Only the part inside the window can be clicked.
      const r = el.getBoundingClientRect();
      const t = Math.max(0, r.top), b = Math.min(window.innerHeight, r.bottom);
      if (b > t) rects.push({ left: r.left, top: t, right: r.right, bottom: b });
    }
    window.overlay.hotRects(rects);
    if (rects.length && !rectTimer) rectTimer = setInterval(reportHotRects, 250);
    if (!rects.length && rectTimer) { clearInterval(rectTimer); rectTimer = null; }
  }

  // Show the newest cards that fit in the window (at most MAX_INTERACTIVE; the newest always,
  // and a card whose Other… field is open is never hidden). The rest wait behind "+N" and
  // come in as cards above them are answered.
  function layoutStack() {
    const cards = [...stack.querySelectorAll('.banner.interactive:not(.leaving)')];
    let more = stack.querySelector('.more');
    if (more) more.remove(); // measured without it
    const room = window.innerHeight - stack.offsetTop - 36; // leave space for the pill
    let shown = 0, waiting = 0, last = null;
    for (const el of cards) {
      const wasQueued = el.classList.contains('queued');
      el.classList.remove('queued');
      const fits = shown === 0
        || (!waiting && shown < MAX_INTERACTIVE && el.offsetTop + el.offsetHeight <= room);
      if (fits || el.querySelector('.free')) {
        shown += 1;
        last = el;
        if (wasQueued) {
          disarm(el, ARM_MS);
          if (el._runBar) el._runBar();
        }
      } else {
        el.classList.add('queued');
        waiting += 1;
      }
    }
    if (waiting && last) {
      if (!more) { more = document.createElement('div'); more.className = 'more'; }
      more.textContent = `+${waiting}`;
      last.after(more);
    }
    reportHotRects();
  }

  // Clicks count only once the card has settled and the pointer has moved over it, so a
  // click aimed at the window underneath never lands on Allow.
  function disarm(el, ms) {
    el._armAt = performance.now() + ms;
    el._moved = false;
    el.classList.add('arming');
  }
  function armOnMove(el) {
    el.addEventListener('pointermove', (e) => {
      // The position must change: a card appearing under a resting pointer, or the window
      // turning clickable, can produce a move event without any movement.
      const moved = el._px !== undefined && (e.screenX !== el._px || e.screenY !== el._py);
      el._px = e.screenX;
      el._py = e.screenY;
      if (moved && performance.now() >= el._armAt) {
        el._moved = true;
        el.classList.remove('arming');
      }
    });
    // A touch tap has no pointermove before its click: once the delay has passed, the tap
    // itself arms the card (pointerdown comes before click).
    el.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse' && performance.now() >= el._armAt) {
        el._moved = true;
        el.classList.remove('arming');
      }
    });
    el.addEventListener('click', (e) => {
      if (!el._moved) { e.stopPropagation(); e.preventDefault(); }
    }, true);
  }

  // Hand keyboard focus back when this card's Other… field had it. Another card's open field
  // keeps it: the overlay stays focusable while any field is open.
  function releaseInput(el) {
    const input = el.querySelector('.free input');
    if (!input) return;
    input.blur();
    const others = [...stack.querySelectorAll('.free input')]
      .some((i) => i !== input && !i.closest('.answered, .expired, .leaving'));
    if (!others) window.overlay.focusInput(false);
  }

  // Cut markers and made-visible hidden characters from the host, highlighted.
  function markup(s) {
    return escapeHtml(s).replace(/⟦U\+[0-9A-F]{4,6}⟧|⏎|… \(\+\d+ more (?:chars|edits)\)/g,
      (m) => `<span class="mark">${m}</span>`);
  }

  function showInteractive(p) {
    const el = bannerShell(p, 'interactive');
    el.dataset.id = p.id;
    el._labels = p.labels;
    interactive.set(String(p.id), el);
    disarm(el, ARM_MS);
    armOnMove(el);
    setTimeout(reportHotRects, 50);
    setTimeout(reportHotRects, 700);
    const c = el.querySelector('.content');
    const panel = document.createElement('div');
    panel.className = 'panel';
    const foot = document.createElement('div');
    foot.className = 'panel foot';
    foot.innerHTML = `<span class="hint"></span><span class="count"></span>`;
    el.appendChild(panel);
    el.appendChild(foot);
    const bar = document.createElement('div');
    bar.className = 'progress';
    el.appendChild(bar);
    const count = foot.querySelector('.count');
    let deadline = Date.now() + p.waitMs;
    let span = p.waitMs;
    // The bar shows the time left; it is rerun when a waiting card comes into view.
    el._runBar = () => {
      const left = Math.max(0, deadline - Date.now());
      bar.style.transition = 'none';
      bar.style.transform = `scaleX(${span > 0 ? left / span : 0})`;
      void bar.offsetWidth;
      bar.style.transition = `transform ${left}ms linear`;
      bar.style.transform = 'scaleX(0)';
    };
    requestAnimationFrame(el._runBar);
    const restartCountdown = (ms) => {
      deadline = Date.now() + ms;
      span = ms;
      el._runBar();
      clearTimeout(el._tick);
      tick();
    };
    const tick = () => {
      if (!count.isConnected || el.classList.contains('answered')) return;
      const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      count.textContent = left >= 90 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : `${left}s`;
      if (left > 0) el._tick = setTimeout(tick, 250);
    };
    tick();
    if (p.sound) { try { chimeAsk(); } catch {} }

    if (p.kind === 'permission') {
      c.remove();
      panel.innerHTML = `<div class="cmd">${markup(p.body || '')}</div>
        <div class="actions">
          <button class="btn danger">${escapeHtml(p.labels.deny)}</button>
          <button class="btn primary">${escapeHtml(p.labels.allow)}</button>
        </div>`;
      panel.querySelector('.danger').addEventListener('click', () => answer(p, el, { behavior: 'deny' }));
      panel.querySelector('.primary').addEventListener('click', () => answer(p, el, { behavior: 'allow' }));
      layoutStack();
      return;
    }

    // Questions, one at a time, as a tappable list.
    const answers = {};
    let idx = 0;
    const renderQ = () => {
      const q = p.questions[idx];
      const total = p.questions.length;
      const selected = new Set();
      c.innerHTML = `
        ${q.header || total > 1 ? `<div class="qhead">${escapeHtml(q.header || '')}${total > 1 ? ` · ${idx + 1}/${total}` : ''}</div>` : ''}
        <div class="body">${escapeHtml(q.question)}</div>`;
      panel.innerHTML = `<div class="list"></div>`;
      const list = panel.querySelector('.list');
      for (const o of q.options) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<div><div class="lbl">${escapeHtml(o.label)}</div>${o.description ? `<div class="desc">${escapeHtml(o.description)}</div>` : ''}</div><span class="chev">${q.multiSelect ? '○' : '›'}</span>`;
        row.addEventListener('click', () => {
          if (q.multiSelect) {
            row.classList.toggle('sel');
            row.querySelector('.chev').textContent = row.classList.contains('sel') ? '✓' : '○';
            if (row.classList.contains('sel')) selected.add(o.label); else selected.delete(o.label);
            return;
          }
          row.classList.add('sel');
          answers[q.key || q.question] = o.label;
          setTimeout(next, 120);
        });
        list.appendChild(row);
      }
      // Free-text answer: Claude's question tool always accepts one. Typing needs keyboard
      // focus, so the overlay takes it only while this field is open and hands it back after.
      const otherRow = document.createElement('div');
      otherRow.className = 'row other';
      otherRow.innerHTML = `<div><div class="lbl">${escapeHtml(p.labels.other || 'Other…')}</div></div><span class="chev">✎</span>`;
      otherRow.addEventListener('click', () => {
        if (panel.querySelector('.free')) { panel.querySelector('.free input').focus(); return; }
        const box = document.createElement('div');
        box.className = 'free';
        box.innerHTML = `<input type="text" maxlength="500" placeholder="${escapeHtml(p.labels.typePlaceholder || '')}" autocomplete="off" spellcheck="false"><button class="btn primary">${escapeHtml(p.labels.send || 'Send')}</button>`;
        panel.appendChild(box);
        const input = box.querySelector('input');
        const submit = () => {
          const v = input.value.trim();
          if (!v) return;
          releaseInput(el);
          if (q.multiSelect) { selected.add(v); answers[q.key || q.question] = [...selected].join(', '); }
          else { answers[q.key || q.question] = v; }
          next();
        };
        box.querySelector('.btn').addEventListener('click', submit);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); submit(); }
          else if (e.key === 'Escape') { e.preventDefault(); releaseInput(el); box.remove(); layoutStack(); }
        });
        const extra = 180000;
        window.overlay.extendWait(p.id, extra);
        restartCountdown(extra);
        window.overlay.focusInput(true);
        setTimeout(() => input.focus(), 60);
        setTimeout(layoutStack, 80);
      });
      list.appendChild(otherRow);
      if (q.multiSelect) {
        const actions = document.createElement('div');
        actions.className = 'actions single';
        actions.innerHTML = `<button class="btn primary">${escapeHtml(p.labels.ok)}</button>`;
        actions.querySelector('.btn').addEventListener('click', () => {
          if (!selected.size) return;
          answers[q.key || q.question] = [...selected].join(', ');
          next();
        });
        panel.appendChild(actions);
      }
    };
    const next = () => {
      // Leaving this question (option, OK or Send) destroys its Other… field: hand the
      // keyboard back first, while the field still exists.
      releaseInput(el);
      idx += 1;
      if (idx < p.questions.length) {
        renderQ();
        // The next question's options now sit where the last click landed.
        disarm(el, REARM_MS);
        layoutStack();
      } else {
        answer(p, el, { answers });
      }
    };
    renderQ();
    layoutStack();
  }

  function answer(p, el, data) {
    if (el.classList.contains('answered')) return;
    releaseInput(el);
    el.classList.add('answered');
    clearTimeout(el._tick);
    const hint = el.querySelector('.hint');
    if (hint) hint.textContent = `✓ ${p.labels.answered}`;
    window.overlay.answer(p.id, data);
    layoutStack();
  }

  function resolveInteractive({ id, answered }) {
    const el = interactive.get(String(id));
    window.overlay.log(`resolve ${id} answered=${answered} found=${!!el}`);
    if (!el) return;
    interactive.delete(String(id));
    // Answered here, on the phone or in the terminal: an open Other… field must not keep
    // the keyboard (or the overlay focusable).
    releaseInput(el);
    if (!answered) {
      el.classList.add('expired');
      clearTimeout(el._tick);
      const hint = el.querySelector('.hint');
      if (hint) hint.textContent = (el._labels && el._labels.answerInApp) || '';
    }
    layoutStack();
    setTimeout(() => dismiss(el), answered ? 900 : 2500);
  }

  // -------------------------------------------------------------- logo
  const logoSlot = document.getElementById('logo-slot');
  let logoTimer = null;

  function showLogo(p) {
    const existing = logoSlot.querySelector('.logo-card');
    if (existing) {
      clearTimeout(logoTimer);
      window.overlay.itemDone();
      logoTimer = setTimeout(hideLogo, p.durationMs || 9000);
      return;
    }
    const card = document.createElement('div');
    card.className = 'logo-card';
    card.innerHTML = `
      <div class="glow"></div>
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="logo-svg">${badgeSvg({ size: 118 })}</div>`;
    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.innerHTML = `<b>✦</b>&nbsp; ${escapeHtml(p.caption || 'Limit reset')}`;
    logoSlot.appendChild(card);
    logoSlot.appendChild(cap);
    if (p.sound) { try { chimeLogo(); } catch {} }
    logoTimer = setTimeout(hideLogo, p.durationMs || 9000);
  }

  function hideLogo() {
    const card = logoSlot.querySelector('.logo-card');
    const cap = logoSlot.querySelector('.caption');
    if (!card) return;
    card.classList.add('leaving');
    if (cap) cap.classList.add('leaving');
    card.addEventListener('animationend', () => {
      card.remove();
      if (cap) cap.remove();
      window.overlay.itemDone();
    }, { once: true });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // --------------------------------------------------------- tray icon
  function buildTrayIcon() {
    const c = document.getElementById('icon-canvas');
    const g = c.getContext('2d');
    const img = new Image();
    const svg = badgeSvg({ size: 32 });
    img.onload = () => {
      g.clearRect(0, 0, 32, 32);
      g.drawImage(img, 0, 0, 32, 32);
      window.overlay.sendTrayIcon(c.toDataURL('image/png'));
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  }

  window.onerror = (m, src, line, col) => { try { window.overlay.log(`error ${m} @${line}:${col}`); } catch {} };
  // The host holds events back until every listener is registered (see `ready`).
  Promise.all([
    window.overlay.on('notify', showBanner),
    window.overlay.on('interactive', showInteractive),
    window.overlay.on('resolve', resolveInteractive),
    window.overlay.on('logo', showLogo),
  ]).finally(() => { if (window.overlay.ready) window.overlay.ready(); });
  buildTrayIcon();
</script>
</body>
</html>
