<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Claude Overlay</title>
<style>
  :root {
    --orange: #d97757;
    --orange-deep: #c4623f;
    --cream: #f4efe8;
    --ink: rgba(255, 255, 255, 0.92);
    --ink-2: rgba(255, 255, 255, 0.62);
    --glass: rgba(26, 26, 28, 0.94);
    --glass-border: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: transparent; overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; pointer-events: none;
  }

  /* ------------------------------------------------------------ banner */
  #stack {
    position: absolute; top: 14px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .banner {
    width: min(420px, 92vw);
    display: grid; grid-template-columns: 40px 1fr auto; column-gap: 12px; align-items: start;
    padding: 12px 14px 13px 12px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(40,40,44,0.96), var(--glass));
    border: 1px solid var(--glass-border);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 18px 50px rgba(0,0,0,0.55),
      0 4px 14px rgba(0,0,0,0.35);
    color: var(--ink);
    transform: translateY(-140px) scale(0.96);
    opacity: 0;
    animation: slide-in 620ms cubic-bezier(0.18, 1.25, 0.32, 1) forwards;
  }
  .banner.leaving {
    animation: slide-out 380ms cubic-bezier(0.5, 0, 0.75, 0) forwards;
  }
  @keyframes slide-in {
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes slide-out {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to   { transform: translateY(-120px) scale(0.96); opacity: 0; }
  }
  .app-icon {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(160deg, #e8906f, var(--orange) 55%, var(--orange-deep));
    display: grid; place-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35), 0 0 0 0.5px rgba(255,255,255,0.18) inset;
  }
  .app-icon svg { width: 26px; height: 26px; }
  .texts { min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 1px; }
  .title { font-weight: 650; font-size: 15px; letter-spacing: -0.01em; line-height: 18px; }
  .subtitle { font-size: 13.5px; color: var(--ink); opacity: 0.9; line-height: 17px; }
  .body {
    font-size: 13.5px; color: var(--ink-2); line-height: 17px; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .time { font-size: 12.5px; color: var(--ink-2); padding-top: 2px; white-space: nowrap; }
  .banner.permission .app-icon { background: linear-gradient(160deg, #ffd27a, #f0a93b 55%, #d98b1c); }
  .banner.info .app-icon { background: linear-gradient(160deg, #8bb7ff, #5a8def 55%, #3f6fd0); }
  .banner.question .app-icon { background: linear-gradient(160deg, #c9a2ff, #9b6cf0 55%, #7a4fd1); }
  .banner.question .body, .banner.permission .body { -webkit-line-clamp: 3; color: var(--ink); }
  .banner.permission .body { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }

  /* -------------------------------------------------------------- logo */
  #logo-slot {
    position: absolute; top: 18px; right: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .logo-card {
    position: relative;
    width: 150px; height: 150px;
    display: grid; place-items: center;
    opacity: 0;
    transform: scale(0.2) rotate(-120deg);
    animation: logo-in 900ms cubic-bezier(0.17, 1.35, 0.35, 1) forwards;
  }
  .logo-card.leaving { animation: logo-out 500ms cubic-bezier(0.5, 0, 0.75, 0) forwards; }
  @keyframes logo-in { to { opacity: 1; transform: scale(1) rotate(0deg); } }
  @keyframes logo-out {
    from { opacity: 1; transform: scale(1) rotate(0deg); }
    to   { opacity: 0; transform: scale(0.6) rotate(40deg); }
  }
  .glow {
    position: absolute; inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(217,119,87,0.55) 0%, rgba(217,119,87,0.18) 40%, rgba(217,119,87,0) 70%);
    animation: glow-pulse 1.8s ease-in-out infinite;
    filter: blur(2px);
  }
  @keyframes glow-pulse {
    0%, 100% { transform: scale(0.9); opacity: 0.7; }
    50%      { transform: scale(1.15); opacity: 1; }
  }
  .ring {
    position: absolute; inset: 12px; border-radius: 50%;
    border: 2px solid rgba(244,239,232,0.0);
    animation: ring-burst 1.6s ease-out infinite;
  }
  .ring.r2 { animation-delay: 0.55s; }
  .ring.r3 { animation-delay: 1.1s; }
  @keyframes ring-burst {
    0%   { transform: scale(0.55); border-color: rgba(244,239,232,0.55); }
    100% { transform: scale(1.35); border-color: rgba(244,239,232,0); }
  }
  .logo-svg {
    width: 118px; height: 118px; position: relative;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
    animation: spin-slow 9s cubic-bezier(0.3, 0.1, 0.2, 1) forwards;
  }
  @keyframes spin-slow { to { transform: rotate(28deg); } }
  .ray {
    stroke: var(--orange); stroke-linecap: round; fill: none;
    transform-origin: 50px 50px;
    animation: breathe 1.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.09); }
  }
  .caption {
    padding: 7px 14px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-border);
    color: var(--cream); font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(-8px);
    animation: caption-in 500ms 350ms cubic-bezier(0.2, 1, 0.3, 1) forwards;
    white-space: nowrap;
  }
  .caption.leaving { animation: caption-out 300ms ease-in forwards; }
  @keyframes caption-in { to { opacity: 1; transform: translateY(0); } }
  @keyframes caption-out { to { opacity: 0; transform: translateY(-8px); } }
  .caption b { color: var(--orange); }
</style>
</head>
<body>
  <div id="stack"></div>
  <div id="logo-slot"></div>
  <canvas id="icon-canvas" width="32" height="32" style="display:none"></canvas>

<script>
  // Claude starburst: 12 rays with slightly irregular angle, length and weight.
  const RAYS = [
    [  0, 1.00, 10.5 ], [ 32, 0.78, 9.5 ], [ 58, 0.92, 10 ], [ 90, 0.70, 9 ],
    [ 118, 0.96, 10.5 ], [ 150, 0.74, 9 ], [ 180, 1.00, 10.5 ], [ 212, 0.80, 9.5 ],
    [ 238, 0.90, 10 ], [ 270, 0.72, 9 ], [ 298, 0.95, 10.5 ], [ 330, 0.76, 9 ],
  ];

  function starburstSvg({ size = 100, color = '#d97757', animated = false } = {}) {
    const cx = 50, cy = 50, inner = 9, outer = 46;
    const rays = RAYS.map(([deg, len, w], i) => {
      const a = (deg * Math.PI) / 180;
      const r2 = inner + (outer - inner) * len;
      const x1 = cx + Math.cos(a) * inner, y1 = cy + Math.sin(a) * inner;
      const x2 = cx + Math.cos(a) * r2,    y2 = cy + Math.sin(a) * r2;
      const delay = animated ? ` style="animation-delay:${(i * 0.09).toFixed(2)}s"` : '';
      return `<line class="ray" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${color}" stroke-width="${w}"${delay}/>`;
    }).join('');
    return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">${rays}</svg>`;
  }

  // ------------------------------------------------------------ audio
  let audioCtx = null;
  function ctx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, gain = 0.18, type = 'sine') {
    const ac = ctx();
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime + start);
    g.gain.setValueAtTime(0.0001, ac.currentTime + start);
    g.gain.exponentialRampToValueAtTime(gain, ac.currentTime + start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + dur);
    osc.connect(g).connect(ac.destination);
    osc.start(ac.currentTime + start);
    osc.stop(ac.currentTime + start + dur + 0.05);
  }
  function chimeNotify() {
    // soft iOS-like tri-tone
    tone(1046.5, 0.00, 0.22, 0.16);
    tone(1318.5, 0.11, 0.26, 0.14);
    tone(1568.0, 0.22, 0.45, 0.12);
  }
  function chimeLogo() {
    // rising arpeggio with a shimmer
    tone(523.25, 0.00, 0.30, 0.12, 'triangle');
    tone(659.25, 0.12, 0.30, 0.12, 'triangle');
    tone(783.99, 0.24, 0.30, 0.12, 'triangle');
    tone(1046.5, 0.36, 0.70, 0.14, 'triangle');
    tone(2093.0, 0.42, 0.60, 0.05, 'sine');
  }

  // ------------------------------------------------------------ banner
  const stack = document.getElementById('stack');
  const MAX_BANNERS = 3;

  function showBanner(p) {
    const el = document.createElement('div');
    el.className = `banner ${p.kind || 'done'}`;
    el.innerHTML = `
      <div class="app-icon">${starburstSvg({ size: 26, color: '#fff' })}</div>
      <div class="texts">
        <div class="title">${escapeHtml(p.title || 'Claude Code')}</div>
        ${p.subtitle ? `<div class="subtitle">${escapeHtml(p.subtitle)}</div>` : ''}
        ${p.body ? `<div class="body">${escapeHtml(p.body)}</div>` : ''}
      </div>
      <div class="time">${escapeHtml(p.nowLabel || 'now')}</div>`;
    stack.appendChild(el);

    while (stack.children.length > MAX_BANNERS) {
      const old = stack.firstElementChild;
      if (old && !old.classList.contains('leaving')) dismiss(old);
      else break;
    }
    if (p.sound) { try { chimeNotify(); } catch {} }

    const t = setTimeout(() => dismiss(el), p.durationMs || 6000);
    el._timer = t;
  }

  function dismiss(el) {
    if (!el || el.classList.contains('leaving')) return;
    clearTimeout(el._timer);
    el.classList.add('leaving');
    el.addEventListener('animationend', () => {
      el.remove();
      window.overlay.itemDone();
    }, { once: true });
  }

  // -------------------------------------------------------------- logo
  const logoSlot = document.getElementById('logo-slot');
  let logoTimer = null;

  function showLogo(p) {
    // Only one logo at a time; a new call restarts the timer.
    const existing = logoSlot.querySelector('.logo-card');
    if (existing) {
      clearTimeout(logoTimer);
      window.overlay.itemDone(); // balance the extra increment
      logoTimer = setTimeout(hideLogo, p.durationMs || 9000);
      return;
    }
    const card = document.createElement('div');
    card.className = 'logo-card';
    card.innerHTML = `
      <div class="glow"></div>
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="logo-svg">${starburstSvg({ size: 118, animated: true })}</div>`;
    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.innerHTML = `<b>✦</b>&nbsp; ${escapeHtml(p.caption || 'Kullanım limiti yenilendi')}`;
    logoSlot.appendChild(card);
    logoSlot.appendChild(cap);
    if (p.sound) { try { chimeLogo(); } catch {} }
    logoTimer = setTimeout(hideLogo, p.durationMs || 9000);
  }

  function hideLogo() {
    const card = logoSlot.querySelector('.logo-card');
    const cap = logoSlot.querySelector('.caption');
    if (!card) return;
    card.classList.add('leaving');
    if (cap) cap.classList.add('leaving');
    card.addEventListener('animationend', () => {
      card.remove();
      if (cap) cap.remove();
      window.overlay.itemDone();
    }, { once: true });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // --------------------------------------------------------- tray icon
  function buildTrayIcon() {
    const c = document.getElementById('icon-canvas');
    const g = c.getContext('2d');
    const img = new Image();
    const svg = starburstSvg({ size: 32, color: '#d97757' });
    img.onload = () => {
      g.clearRect(0, 0, 32, 32);
      g.drawImage(img, 0, 0, 32, 32);
      window.overlay.sendTrayIcon(c.toDataURL('image/png'));
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  }

  window.overlay.on('notify', showBanner);
  window.overlay.on('logo', showLogo);
  window.overlay.on('config', () => {});
  buildTrayIcon();
</script>
</body>
</html>
