name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: only the publish job, which runs no project code, can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: powershell -ExecutionPolicy Bypass -File scripts/dist.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HeadsUp-win64
          path: |
            dist/HeadsUp.exe
            dist/HeadsUp-win64.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HeadsUp-win64
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum HeadsUp.exe HeadsUp-win64.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/HeadsUp.exe
            dist/HeadsUp-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/HeadsUp.exe
            dist/HeadsUp-win64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
